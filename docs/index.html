<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Varda Modpack</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      line-height: 1.5;
    }
    pre {
      background: #111;
      color: #eee;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre;
    }
    a {
      display: inline-block;
      margin-bottom: 1rem;
    }
</style>
</head>
<body>
  <h1>Varda Modpack</h1>
  <h2>Manifest</h2>
  <p><a href="manifest.json">Manifest JSON</a></p>
  <pre id="manifest">Loading manifest...</pre>
  <script>
    async function loadManifest() {
      const output = document.getElementById("manifest");
      try {
        const response = await fetch("manifest.json");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const manifest = await response.json();
        output.textContent = JSON.stringify(manifest, null, 2);
      } catch (error) {
        output.textContent = `Failed to load manifest.json: ${error}`;
      }
    }
    loadManifest();
  </script>
</body>
</html>
