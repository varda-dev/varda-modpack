<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Varda Modpack</title>
  <style>body { margin: 1rem; }</style>
</head>
<body>
  <h1>Varda Modpack</h1>
  <p><a href="https://www.curseforge.com/minecraft/modpacks/varda">Curseforge Project Page</a></p>
  <p><a href="https://modrinth.com/project/varda">Modrinth Project Page</a></p>
  <h3>Manifest <a href="manifest.json">JSON</a></h3>
  <pre id="manifest">Loading manifest...</pre>
  <script>
    async function loadManifest() {
      const output = document.getElementById("manifest");
      try {
        const response = await fetch("manifest.json");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const manifest = await response.json();
        output.textContent = JSON.stringify(manifest, null, 2);
      } catch (error) {
        output.textContent = `Failed to load manifest.json: ${error}`;
      }
    }
    loadManifest();
  </script>
</body>
</html>
