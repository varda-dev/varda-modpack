name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release.
        required: true
        type: string
      release_type:
        description: Release channel.
        required: true
        type: choice
        options:
          - alpha
          - beta
          - release
        default: beta
      changelog:
        description: Release notes.
        required: true
        type: string
      replace_assets:
        description: Replace same-name GitHub release assets.
        required: true
        type: boolean
        default: false
      publish_curseforge:
        description: Upload the CurseForge client zip.
        required: true
        type: boolean
        default: true
      publish_github:
        description: Upload server installers to GitHub Releases.
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    # The prep step needs access to the local CurseForge instance path so it can
    # regenerate the modpack zip and server payload before publishing.
    runs-on: self-hosted
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      RELEASE_CHANGELOG: ${{ inputs.changelog }}
      REPLACE_ASSETS: ${{ inputs.replace_assets }}
      PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
      PUBLISH_GITHUB: ${{ inputs.publish_github }}
      CURSEFORGE_INSTANCE_DIR: ${{ vars.CURSEFORGE_INSTANCE_DIR }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      GITHUB_RELEASES_PAT: ${{ secrets.GITHUB_RELEASES_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare release artifacts
        shell: bash
        run: python scripts/prep-files.py --both -v "$RELEASE_VERSION" -r "$RELEASE_TYPE" -f

      - name: Upload CurseForge client zip
        if: ${{ inputs.publish_curseforge }}
        shell: bash
        run: python scripts/cf-upload.py -v "$RELEASE_VERSION" -r "$RELEASE_TYPE" -c "$RELEASE_CHANGELOG"

      - name: Upload GitHub release assets
        if: ${{ inputs.publish_github }}
        shell: bash
        run: |
          export GITHUB_RELEASES_PAT="${GITHUB_RELEASES_PAT:-$GITHUB_TOKEN}"
          args=(-v "$RELEASE_VERSION" -r "$RELEASE_TYPE" -c "$RELEASE_CHANGELOG")
          if [ "$REPLACE_ASSETS" = "true" ]; then
            args+=(--replace-assets)
          fi
          python scripts/gh-upload.py "${args[@]}"
